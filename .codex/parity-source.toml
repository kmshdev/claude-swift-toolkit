id = "plan-architecture"
label = "Plan and architect Apple app work"
description = "Use the architecture lane for lifecycle planning, system boundaries, app scaffolding, and repo-level design choices."
skills = [
  "codex-operating-layer",
  "app-development-workflow",
  "macos-development",
  "swift-app-lifecycle",
  "swift-project-scaffold"
]
agents = ["swift_architect"]

